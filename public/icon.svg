<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="innerEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>
  
  <!-- Left Ear -->
  <polygon points="120,240 160,80 250,180" fill="#EA580C" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="135,220 165,110 230,180" fill="url(#innerEar)"/>
  
  <!-- Right Ear -->
  <polygon points="392,240 352,80 262,180" fill="#EA580C" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="377,220 347,110 282,180" fill="url(#innerEar)"/>
  
  <!-- Cat Head -->
  <ellipse cx="256" cy="290" rx="150" ry="130" fill="#FFFFFF"/>
  
  <!-- Cheeks blush -->
  <circle cx="160" cy="320" r="22" fill="#FED7AA" opacity="0.6"/>
  <circle cx="352" cy="320" r="22" fill="#FED7AA" opacity="0.6"/>

  <!-- Left Eye (Playful open) -->
  <ellipse cx="200" cy="270" rx="16" ry="22" fill="#374151"/>
  <circle cx="205" cy="264" r="7" fill="#FFFFFF"/>
  <circle cx="196" cy="276" r="3" fill="#FFFFFF"/>

  <!-- Right Eye (Winking / happy arch) -->
  <path d="M 292 272 Q 312 250 332 272" fill="none" stroke="#374151" stroke-width="10" stroke-linecap="round"/>

  <!-- Nose -->
  <polygon points="256,305 244,292 268,292" fill="#F97316"/>

  <!-- Mouth -->
  <path d="M 244 308 Q 235 322 220 316" fill="none" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M 268 308 Q 277 322 292 316" fill="none" stroke="#374151" stroke-width="6" stroke-linecap="round"/>

  <!-- Whiskers Left -->
  <line x1="120" y1="295" x2="175" y2="305" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round"/>
  <line x1="115" y1="320" x2="170" y2="320" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round"/>

  <!-- Whiskers Right -->
  <line x1="392" y1="295" x2="337" y2="305" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round"/>
  <line x1="397" y1="320" x2="342" y2="320" stroke="#9CA3AF" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Audio wave badge / cute collar bell -->
  <circle cx="256" cy="385" r="16" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  <line x1="256" y1="388" x2="256" y2="397" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
</svg>